[package]
name = "batana-tool"
version = "0.1.0"
description = "Batana 素材采集与标注工具"
authors = ["Batana"]
edition = "2021"

[lib]
name = "batana_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.6"
# 视频 sha256（契约可选字段）与 ULID 随机数；均已存在于 Cargo.lock
sha2 = "0.10"
getrandom = "0.3"
base64 = "0.22"

# 采集热路径（逐字节转换/组帧/拷贝）在 debug 默认 opt-level=0 下慢一个量级，
# 实测吞吐仅 ~63fps 且预览延迟持续增长；本 crate 单独提速（依赖仍快速编译）
[profile.dev.package.batana-tool]
opt-level = 2
